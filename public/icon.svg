  <rect x="402" y="225" width="24" height="60" rx="10" fill="#6366f1" />
  <circle cx="256" cy="100" r="16" fill="#38bdf8" />
  <line x1="256" y1="140" x2="256" y2="116" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  
  <!-- Robot Crown on Head -->
  <path d="M196 135 L226 80 L256 120 L286 80 L316 135 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="4" stroke-linejoin="round" />
  <circle cx="226" cy="76" r="6" fill="#ef4444" />
  <circle cx="256" cy="116" r="6" fill="#3b82f6" />
  <circle cx="286" cy="76" r="6" fill="#10b981" />

  <!-- Robot Eyes (Visor) -->
  <rect x="156" y="195" width="200" height="65" rx="20" fill="#020617" stroke="#38bdf8" stroke-width="4" />
  <circle cx="206" cy="227" r="16" fill="#38bdf8" />
  <circle cx="306" cy="227" r="16" fill="#38bdf8" />
  <circle cx="212" cy="223" r="5" fill="#ffffff" />
  <circle cx="312" cy="223" r="5" fill="#ffffff" />

